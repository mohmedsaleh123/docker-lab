events { # قسم إعدادات الأحداث للتحكم في كيفية تعامل Nginx مع الاتصالات
    worker_connections 1024; # تحديد الحد الأقصى لعدد الاتصالات المتزامنة لكل عامل (worker)
}

http { # قسم إعدادات HTTP الأساسية
    upstream backend { # تعريف مجموعة من الخوادم الخلفية باسم 'backend' لموازنة الحمل أو التوجيه
        server api:8000; # تحديد خادم الواجهة البرمجية (API) على المنفذ 8000 كعضو في مجموعة backend
    }

    server { # إعدادات الخادم الوهمي (Virtual Server)
        listen 80; # جعل الخادم يستمع للطلبات الواردة على المنفذ 80 (المنفذ الافتراضي لـ HTTP)

        location / { # تقديم ملفات الواجهة الأمامية الثابتة (Frontend)
            root /usr/share/nginx/html; # مسار الملفات داخل الحاوية
            index index.html; # الملف الافتراضي
            try_files $uri $uri/ /index.html; # محاولة البحث عن الملف، أو المجلد، أو إرجاع index.html
        }

        location /api/ { # تحديد كتلة أوامر خاصة بالطلبات التي يبدأ مسارها بـ '/api/'
            proxy_pass http://backend; # تمرير (توجيه) الطلبات إلى مجموعة الخوادم 'backend' المعرفة سابقاً
            proxy_set_header Host $host; # الاحتفاظ باسم المضيف (Host) الأصلي وإرساله للخادم الخلفي
            proxy_set_header X-Real-IP $remote_addr; # إرسال عنوان IP الحقيقي للعميل (المستخدم) إلى الخادم الخلفي
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # إرسال سلسلة عناوين IP التي مر بها الطلب (مفيد لمعرفة مصدر الطلب الأصلي)
        }
    }
}
